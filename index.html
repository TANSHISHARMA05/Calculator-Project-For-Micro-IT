  <body>
    <!-- <h1>Calculator</h1> -->

    <div class="main">
      <div class="container">
        <div class="result">
          <input
            class="history input2"
            type="text"
            name=""
            value=""
            id="history"
          />
          <input class="reslt" type="text" name="" value="" id="result" />
          <!-- <input class="input"  type="text" name=""  value="inp3"  id=""> -->
        </div>
        <hr />
        <hr />

        <div class="keys">
          <table cellspacing="0px" cellpadding="0px">
            <tr>
              <td>
                <input
                  type="button"
                  value="C"
                  onclick="clr()"
                  ondblclick="clrAll()"
                  class="operator"
                />
              </td>
              <td>
                <input
                  type="button"
                  value="✕"
                  onclick="del()"
                  class="operator"
                />
              </td>
              <td>
                <input
                  type="button"
                  value="%"
                  onclick="display('%')"
                  class="operator"
                />
              </td>
              <td>
                <input
                  type="button"
                  value="÷"
                  onclick="display('/')"
                  class="operator"
                />
              </td>
            </tr>

            <tr>
              <td><input type="button" value="7" onclick="display('7')" /></td>
              <td><input type="button" value="8" onclick="display('8')" /></td>
              <td><input type="button" value="9" onclick="display('9')" /></td>
              <td>
                <input
                  type="button"
                  value="×"
                  onclick="display('*')"
                  class="operator"
                />
              </td>
            </tr>

            <tr>
              <td><input type="button" value="4" onclick="display('4')" /></td>
              <td><input type="button" value="5" onclick="display('5')" /></td>
              <td><input type="button" value="6" onclick="display('6')" /></td>
              <td>
                <input
                  type="button"
                  value="–"
                  onclick="display('-')"
                  class="operator"
                />
              </td>
            </tr>

            <tr>
              <td><input type="button" value="1" onclick="display('1')" /></td>
              <td><input type="button" value="2" onclick="display('2')" /></td>
              <td><input type="button" value="3" onclick="display('3')" /></td>
              <td>
                <input
                  type="button"
                  value="+"
                  onclick="display('+')"
                  class="operator"
                />
              </td>
            </tr>

            <tr>
              <td>
                <input
                  type="button"
                  value="↺"
                  onclick="display('.')"
                  class="operator"
                  disabled
                />
              </td>
              <td><input type="button" value="0" onclick="display('0')" /></td>
              <td><input type="button" value="•" onclick="display('.')" /></td>
              <td>
                <input
                  type="button"
                  value="="
                  onclick="equate()"
                  class="operator equal"
                />
              </td>
            </tr>
          </table>
